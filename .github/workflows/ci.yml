name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, codex/frontend-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gpu_erp_test
          POSTGRES_PASSWORD: gpu_erp_test_password
          POSTGRES_DB: gpu_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpu_erp_test -d gpu_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Typecheck server
        run: npm run typecheck:server
      - name: Typecheck server tests
        run: npm run typecheck:server-tests
      - name: Lint and architecture checks
        run: npm run lint
      - name: Test
        run: npm test
      - name: Production preflight script tests
        run: npm run test:production-scripts
      - name: Build
        run: npm run build
      - name: Frontend performance budgets
        run: npm run check:performance
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Release traceability check
        run: npm run check:release
      - name: Backend HTTP integration tests
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://gpu_erp_test:gpu_erp_test_password@127.0.0.1:5432/gpu_erp_test
          TEST_DATABASE_SSL: "false"
          POSTGRES_IMPORT_LEGACY_JSON: "false"
          RUN_BACKEND_HTTP_TESTS: "1"
          BACKEND_TEST_USERNAME: admin
          BACKEND_TEST_PASSWORD: admin123
        run: npm run test:backend-http
      - name: Browser smoke (desktop, tablet and mobile)
        run: |
          npx --yes --package @playwright/cli@0.1.22 playwright-cli install-browser chrome
          npm run preview > /tmp/erp-browser-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3010/ >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          npm run smoke:browser
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: output/playwright/browser-smoke
          if-no-files-found: ignore
