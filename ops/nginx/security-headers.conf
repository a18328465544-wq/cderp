# Include this snippet in the HTTPS server block serving the built SPA.
# Keep CSP under an explicit browser-compatibility review because the frontend
# may use inline styles and third-party assets during the migration period.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
