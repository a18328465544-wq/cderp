# Include this snippet in the HTTPS server block that serves the built SPA.
# It compresses text responses while leaving downloads and already-compressed
# media untouched. Keep `gzip_min_length` above tiny icon/health responses so
# compression work is only spent where it reduces transfer time.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  application/xml
  application/rss+xml
  image/svg+xml;
